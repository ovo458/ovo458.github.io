<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 城市殭屍大戰 - 武器商店版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #d35400;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            user-select: none;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 20;
        }
        #name-btn {
            margin-top: 5px;
            padding: 4px 10px;
            background: #2ecc71;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        #weapon-info {
            margin-top: 8px;
            color: #f1c40f;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 4px;
            display: inline-block;
        }
        #leaderboard-container {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #2ecc71;
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            font-size: 14px;
            min-width: 150px;
            z-index: 20;
        }
        #leaderboard-container h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #2ecc71;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        #shop-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #ff5722;
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #shop-ui {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 15px;
            padding: 20px;
            color: white;
            z-index: 200;
            width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        #shop-ui h2 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #f1c40f;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .shop-item-info {
            display: flex;
            flex-direction: column;
        }
        .shop-item-title {
            font-weight: bold;
            color: #fff;
        }
        .shop-item-cost {
            font-size: 12px;
            color: #f1c40f;
        }
        .buy-btn {
            padding: 6px 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-btn.owned {
            background: #7f8c8d;
            cursor: default;
        }
        #close-shop {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 8px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            border: 2px solid #2ecc71;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #2ecc71;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #mobile-controls {
            display: none;
        }
        #move-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 50;
        }
        #joystick {
            position: absolute;
            top: 50%; left: 50%;
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #action-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            z-index: 60;
        }
        #jump-btn {
            width: 70px; height: 70px;
            background: rgba(44, 62, 80, 0.8);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: white; font-weight: bold; font-size: 16px;
            display: flex; justify-content: center; align-items: center;
        }
        #shoot-btn {
            width: 95px; height: 95px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; font-size: 20px;
        }
        #pc-hint {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c; font-size: 36px; font-weight: bold; text-align: center;
            background: rgba(0,0,0,0.9); padding: 25px; border-radius: 15px; z-index: 100;
            border: 2px solid #e74c3c;
        }
        #debug-shield {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: red; color: white;
            padding: 20px; font-size: 20px; font-weight: bold;
            z-index: 9999; display: block; text-align: center;
            border-radius: 10px;
        }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <div id="debug-shield">⚠️ 3D 引擎載入失敗！</div>

    <div id="ui-container">
        <div>擊退殭屍數: <span id="score-val">0</span></div>
        <div>金錢: $<span id="money-val">0</span></div>
        <div>你的血量: <span id="hp-val">100</span>%</div>
        <div style="margin-top: 5px;">目前玩家: <span id="current-name-val">無名英雄</span></div>
        <button id="name-btn" onclick="changePlayerName(event)">⚙️ 設置名稱</button>
        <br>
        <div id="weapon-info">武器: 手槍 (單發)</div>
    </div>

    <button id="shop-btn" onclick="openShop(event)">🛒 武器商店</button>

    <div id="shop-ui">
        <h2>🛒 武器補給站</h2>
        <div id="shop-items-list"></div>
        <button id="close-shop" onclick="closeShop(event)">關閉商店</button>
    </div>

    <div id="leaderboard-container">
        <h3>🏆 歷史排行</h3>
        <div id="leaderboard-list"></div>
    </div>

    <div id="crosshair"></div>
    <div id="pc-hint">點擊畫面鎖定滑鼠即可轉動視角 (B或點上方開商店/ESC退出)</div>

    <div id="mobile-controls">
        <div id="move-zone"><div id="joystick"></div></div>
        <div id="action-container">
            <div id="jump-btn">JUMP</div>
            <div id="shoot-btn">發射</div>
        </div>
    </div>

    <div id="game-over">
        腦袋被吃掉了...
        <button onclick="resetGame()" style="margin-top:15px; padding:10px 25px; background:#2ecc71; color:white; border:none; border-radius:5px; cursor:pointer;">再戰一回</button>
    </div>

    <script>
        if (typeof THREE !== 'undefined') {
            document.getElementById('debug-shield').style.display = 'none';
        }

        let scene, camera, renderer;
        let zombies = [], bullets = [];
        let score = 0, hp = 100, money = 0, isGameOver = false, spawnTimer;
        let gunGroup, muzzleFlash, gunBarrel, gunBodyMesh;
        
        let cameraAngleX = 0, cameraAngleY = 0; 
        let moveDirection = { x: 0, z: 0 }; 
        
        let kbState = { w: 0, s: 0, a: 0, d: 0 };
        const mouseSensitivity = 0.0025;
        const playerSpeed = 0.16;

        let moveTouchId = null, moveStart = { x: 0, y: 0 };
        let lookTouchId = null, lookLast = { x: 0, y: 0 };

        let playerVelocityY = 0, isJumping = false;
        const gravity = -0.012, jumpStrength = 0.26, defaultPlayerHeight = 1.6;
        let walkTime = 0;

        let isShopOpen = false;
        let isMouseDown = false;
        let lastShotTime = 0;

        const weapons = {
            pistol: { name: "手槍", cost: 0, dmg: 1, delay: 400, auto: false, color: 0x27ae60, bSize: 0.03, lSize: 0.4 },
            rifle: { name: "步槍", cost: 150, dmg: 1.5, delay: 150, auto: true, color: 0xd35400, bSize: 0.04, lSize: 0.5 },
            shotgun: { name: "散彈槍", cost: 300, dmg: 1, delay: 800, auto: false, color: 0x8e44ad, bSize: 0.06, lSize: 0.3, pellets: 5 }
        };
        let ownedWeapons = ["pistol"];
        let currentWeaponKey = "pistol";

        let playerName = localStorage.getItem('zombie_player_name') || '無名英雄';
        document.getElementById('current-name-val').innerText = playerName;

        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

        function changePlayerName(e) {
            e.stopPropagation();
            const newName = prompt("請輸入你的名稱 (最多 8 個字)：", playerName);
            if (newName && newName.trim() !== "") {
                playerName = newName.trim().substring(0, 8);
                localStorage.setItem('zombie_player_name', playerName);
                document.getElementById('current-name-val').innerText = playerName;
            }
        }

        window.onload = function() {
            if (typeof THREE === 'undefined') return;
            init();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe67e22);
            scene.fog = new THREE.FogExp2(0xe67e22, 0.01);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, defaultPlayerHeight, 0); 
            scene.add(camera); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, depth: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio || 1); 
            document.body.appendChild(renderer.domElement);

            const gridHelper = new THREE.GridHelper(400, 80, 0x27ae60, 0xffffff);
            gridHelper.position.y = 0.01; 
            scene.add(gridHelper);

            const tGeo = new THREE.BoxGeometry(8, 25, 8);
            const tMat = new THREE.MeshBasicMaterial({ color: 0x2980b9 });
            const testBuilding = new THREE.Mesh(tGeo, tMat);
            testBuilding.position.set(0, 12.5, -12);
            scene.add(testBuilding);

            for (let i = 0; i < 30; i++) {
                let h = 15 + Math.random() * 15;
                const bGeo = new THREE.BoxGeometry(6, h, 6);
                const bMat = new THREE.MeshBasicMaterial({ color: 0x2c3e50 });
                const building = new THREE.Mesh(bGeo, bMat);
                let angle = Math.random() * Math.PI * 2;
                let radius = 20 + Math.random() * 60;
                building.position.set(Math.cos(angle) * radius, h / 2, Math.sin(angle) * radius);
                scene.add(building);
            }

            createGun();
            
            if (isMobile) {
                document.getElementById('mobile-controls').style.display = 'block';
                setupMobileControls();
            } else {
                document.getElementById('pc-hint').style.display = 'block';
                setupPCControls();
            }

            updateLeaderboardUI();
            renderShop();
            window.addEventListener('resize', onWindowResize);
            spawnTimer = setInterval(spawnZombie, 1800);
        }

        function createGun() {
            gunGroup = new THREE.Group();
            
            gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.4, 8), new THREE.MeshBasicMaterial({ color: 0x27ae60 }));
            gunBarrel.rotateX(Math.PI / 2); 
            gunBarrel.position.set(0, 0, -0.3);
            gunGroup.add(gunBarrel);

            const bodyGeo = new THREE.BoxGeometry(0.08, 0.08, 0.3);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0x2c3e50 });
            gunBodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            gunBodyMesh.position.set(0, -0.02, -0.15);
            gunGroup.add(gunBodyMesh);

            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 }));
            muzzleFlash.position.set(0, 0, -0.52);
            gunGroup.add(muzzleFlash);

            gunGroup.position.set(0.25, -0.22, -0.45);
            camera.add(gunGroup); 
            updateGunVisual();
        }

        function updateGunVisual() {
            const w = weapons[currentWeaponKey];
            if (!gunBarrel) return;
            
            scene.remove(gunBarrel);
            gunGroup.remove(gunBarrel);

            gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(w.bSize, w.bSize * 1.2, w.lSize, 8), new THREE.MeshBasicMaterial({ color: w.color }));
            gunBarrel.rotateX(Math.PI / 2);
            gunBarrel.position.set(0, 0, -w.lSize/2 - 0.1);
            gunGroup.add(gunBarrel);

            muzzleFlash.position.set(0, 0, -w.lSize - 0.12);
            
            let autoText = w.auto ? "連發" : "單發";
            document.getElementById('weapon-info').innerText = `武器: ${w.name} (${autoText})`;
        }

        function setupPCControls() {
            const canvasElement = renderer.domElement;
            canvasElement.addEventListener('click', () => {
                if (!isGameOver && !isShopOpen) canvasElement.requestPointerLock();
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === canvasElement && !isGameOver && !isShopOpen) {
                    cameraAngleX -= e.movementX * mouseSensitivity;
                    cameraAngleY = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, cameraAngleY - e.movementY * mouseSensitivity));
                    camera.quaternion.setFromEuler(new THREE.Euler(cameraAngleY, cameraAngleX, 0, 'YXZ'));
                }
            });

            window.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (e.code === 'KeyW') kbState.w = 1;
                if (e.code === 'KeyS') kbState.s = 1;
                if (e.code === 'KeyA') kbState.a = 1;
                if (e.code === 'KeyD') kbState.d = 1;
                if (e.code === 'Space') jump();
                if (e.code === 'KeyB') {
                    if (isShopOpen) closeShop();
                    else openShop();
                }
                updatePCMoveDirection();
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') kbState.w = 0;
                if (e.code === 'KeyS') kbState.s = 0;
                if (e.code === 'KeyA') kbState.a = 0;
                if (e.code === 'KeyD') kbState.d = 0;
                updatePCMoveDirection();
            });

            window.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement === canvasElement && e.button === 0 && !isGameOver && !isShopOpen) {
                    isMouseDown = true;
                    triggerShoot();
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (e.button === 0) isMouseDown = false;
            });
        }

        function updatePCMoveDirection() {
            moveDirection.x = kbState.d - kbState.a;
            moveDirection.z = kbState.s - kbState.w;
        }

        function setupMobileControls() {
            const moveZone = document.getElementById('move-zone');
            const joystick = document.getElementById('joystick');
            const shootBtn = document.getElementById('shoot-btn');
            const jumpBtn = document.getElementById('jump-btn');

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (e.target === shootBtn) { 
                        isMouseDown = true; 
                        triggerShoot(); 
                        continue; 
                    }
                    if (e.target === jumpBtn) { jump(); continue; }
                    
                    if (t.clientX < window.innerWidth / 2 && moveTouchId === null) {
                        moveTouchId = t.identifier; 
                        moveStart.x = t.clientX; 
                        moveStart.y = t.clientY;
                        continue;
                    }
                    if (t.clientX >= window.innerWidth / 2 && lookTouchId === null && !isShopOpen) {
                        lookTouchId = t.identifier; 
                        lookLast.x = t.clientX; 
                        lookLast.y = t.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const t = e.touches[i];
                    if (t.identifier === moveTouchId) {
                        let dx = t.clientX - moveStart.x; 
                        let dy = t.clientY - moveStart.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
                        joystick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        
                        moveDirection.x = dx / 40; 
                        moveDirection.z = dy / 40;
                    }
                    if (t.identifier === lookTouchId) {
                        cameraAngleX -= (t.clientX - lookLast.x) * 0.006;
                        cameraAngleY = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, cameraAngleY - (t.clientY - lookLast.y) * 0.006));
                        camera.quaternion.setFromEuler(new THREE.Euler(cameraAngleY, cameraAngleX, 0, 'YXZ'));
                        lookLast.x = t.clientX; lookLast.y = t.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === moveTouchId) { 
                        moveTouchId = null; 
                        joystick.style.transform = 'translate(-50%, -50%)'; 
                        moveDirection.x = 0; moveDirection.z = 0; 
                    }
                    if (t.identifier === lookTouchId) lookTouchId = null;
                    if (e.target === shootBtn) isMouseDown = false;
                }
            });
        }

        function openShop(e) {
            if(e) e.stopPropagation();
            isShopOpen = true;
            document.getElementById('shop-ui').style.display = 'block';
            if(!isMobile) document.exitPointerLock();
        }

        function closeShop(e) {
            if(e) e.stopPropagation();
            isShopOpen = false;
            document.getElementById('shop-ui').style.display = 'none';
        }

        function renderShop() {
            const listContainer = document.getElementById('shop-items-list');
            listContainer.innerHTML = '';
            
            Object.keys(weapons).forEach(key => {
                const w = weapons[key];
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                
                let btnText = ownedWeapons.includes(key) ? "裝備" : `$${w.cost}`;
                let btnClass = "buy-btn";
                if (currentWeaponKey === key) {
                    btnText = "已裝備";
                    btnClass = "buy-btn owned";
                }

                itemDiv.innerHTML = `
                    <div class="shop-item-info">
                        <span class="shop-item-title" style="color: #${w.color.toString(16)}">${w.name}</span>
                        <span class="shop-item-cost">威力: ${w.dmg} | 速度: ${w.delay}ms</span>
                    </div>
                    <button class="${btnClass}" onclick="buyOrEquip('${key}', event)">${btnText}</button>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        function buyOrEquip(key, e) {
            e.stopPropagation();
            const w = weapons[key];
            if (ownedWeapons.includes(key)) {
                currentWeaponKey = key;
                updateGunVisual();
                renderShop();
            } else {
                if (money >= w.cost) {
                    money -= w.cost;
                    document.getElementById('money-val').innerText = money;
                    ownedWeapons.push(key);
                    currentWeaponKey = key;
                    updateGunVisual();
                    renderShop();
                } else {
                    alert("金錢不足！");
                }
            }
        }

        function jump() { if (!isJumping && !isGameOver && !isShopOpen) { isJumping = true; playerVelocityY = jumpStrength; } }

        function triggerShoot() {
            if (isGameOver || isShopOpen) return;
            let now = performance.now();
            let w = weapons[currentWeaponKey];
            if (now - lastShotTime >= w.delay) {
                shoot(w);
                lastShotTime = now;
            }
        }

        function shoot(w) {
            muzzleFlash.material.opacity = 1; 
            gunGroup.position.z = -0.38; 
            setTimeout(() => { 
                muzzleFlash.material.opacity = 0; 
                gunGroup.position.z = -0.45;
            }, 50);

            const gunWorldPos = new THREE.Vector3(); 
            muzzleFlash.getWorldPosition(gunWorldPos);
            
            const baseDir = new THREE.Vector3(); 
            camera.getWorldDirection(baseDir);

            if (w.pellets) {
                for (let i = 0; i < w.pellets; i++) {
                    const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
                    bullet.position.copy(gunWorldPos);
                    
                    let dir = baseDir.clone();
                    dir.x += (Math.random() - 0.5) * 0.12;
                    dir.y += (Math.random() - 0.5) * 0.12;
                    dir.z += (Math.random() - 0.5) * 0.12;
                    dir.normalize();

                    bullet.userData = { dir: dir, dmg: w.dmg, born: performance.now() };
                    scene.add(bullet); 
                    bullets.push(bullet);
                }
            } else {
                const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
                bullet.position.copy(gunWorldPos);
                bullet.userData = { dir: baseDir, dmg: w.dmg, born: performance.now() };
                scene.add(bullet); 
                bullets.push(bullet);
            }
        }

        function spawnZombie() {
            if (isGameOver || isShopOpen) return;
            const zombieGroup = new THREE.Group();
            
            let hpMax = 1 + Math.floor(score / 10) * 0.5;
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.7), new THREE.MeshBasicMaterial({ color: 0x556b2f }));
            body.position.y = 0.55; zombieGroup.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
            head.position.y = 1.15; zombieGroup.add(head);

            let angle = Math.random() * Math.PI * 2; let distance = 25 + Math.random() * 15;
            zombieGroup.position.set(camera.position.x + Math.cos(angle)*distance, 0, camera.position.z + Math.sin(angle)*distance);
            
            zombieGroup.userData = { hp: hpMax };
            
            scene.add(zombieGroup); zombies.push(zombieGroup);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return;

            if (weapons[currentWeaponKey].auto && isMouseDown) {
                triggerShoot();
            }

            if (isJumping) {
                playerVelocityY += gravity; camera.position.y += playerVelocityY;
                if (camera.position.y <= defaultPlayerHeight) { camera.position.y = defaultPlayerHeight; isJumping = false; playerVelocityY = 0; }
            }

            if ((moveDirection.x !== 0 || moveDirection.z !== 0) && !isShopOpen) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); right.y = 0; right.normalize();
                
                let mag = Math.sqrt(moveDirection.x*moveDirection.x + moveDirection.z*moveDirection.z);
                let factorX = moveDirection.x / mag;
                let factorZ = moveDirection.z / mag;

                camera.position.addScaledVector(forward, -factorZ * playerSpeed * Math.min(1, mag));
                camera.position.addScaledVector(right, factorX * playerSpeed * Math.min(1, mag));

                walkTime += 0.2;
                gunGroup.position.y = -0.22 + Math.sin(walkTime) * 0.015;
                gunGroup.position.x = 0.25 + Math.cos(walkTime) * 0.01;
            }

            let now = performance.now();
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.position.addScaledVector(b.userData.dir, 1.4);
                if (now - b.userData.born > 1500) { scene.remove(b); bullets.splice(i, 1); continue; }
                
                for (let j = zombies.length - 1; j >= 0; j--) {
                    const z = zombies[j];
                    if (b.position.distanceTo(z.position.clone().setY(0.7)) < 1.3) {
                        z.userData.hp -= b.userData.dmg;
                        scene.remove(b); bullets.splice(i, 1);
                        
                        if (z.userData.hp <= 0) {
                            scene.remove(z); zombies.splice(j, 1);
                            score++; 
                            let reward = 10 + Math.floor(Math.random() * 11);
                            money += reward;
                            document.getElementById('score-val').innerText = score;
                            document.getElementById('money-val').innerText = money;
                        }
                        break;
                    }
                }
            }

            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];
                const dir = new THREE.Vector3().copy(camera.position).sub(z.position); dir.y = 0; dir.normalize();
                if (!isShopOpen) z.position.addScaledVector(dir, 0.06);
                z.lookAt(camera.position.x, z.position.y, camera.position.z);
                
                if (z.position.distanceTo(new THREE.Vector3(camera.position.x, 0, camera.position.z)) < 2.0) {
                    scene.remove(z); zombies.splice(j, 1); hp -= 20;
                    document.getElementById('hp-val').innerText = Math.max(0, hp);
                    if (hp <= 0) endGame();
                }
            }
            renderer.render(scene, camera);
        }

        function getLeaderboard() { 
            const data = localStorage.getItem('zombie_city_scores'); 
            return data ? JSON.parse(data) : [{name: "生存專家", score: 12}, {name: "王牌射手", score: 6}]; 
        }

        function updateLeaderboardUI() {
            const container = document.getElementById('leaderboard-list'); if(!container) return; container.innerHTML = '';
            getLeaderboard().forEach((item, index) => {
                const div = document.createElement('div'); div.className = 'leaderboard-item';
                div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${item.score} 隻</span>`; container.appendChild(div);
            });
        }

        function endGame() {
            isGameOver = true; 
            document.getElementById('game-over').style.display = 'block'; 
            clearInterval(spawnTimer);
            if(!isMobile) document.exitPointerLock();
            
            let list = getLeaderboard();
            list.push({ name: playerName, score: score });
            list.sort((a, b) => b.score - a.score);
            list = list.slice(0, 3);
            localStorage.setItem('zombie_city_scores', JSON.stringify(list));
            updateLeaderboardUI();
        }

        function resetGame() { 
            zombies.forEach(z => scene.remove(z));
            bullets.forEach(b => scene.remove(b));
            zombies = []; bullets = [];
            camera.position.set(0, defaultPlayerHeight, 0);
            cameraAngleX = 0; cameraAngleY = 0;
            camera.quaternion.set(0, 0, 0, 1);
            document.getElementById('game-over').style.display = 'none'; 
            hp = 100; score = 0; money = 0;
            ownedWeapons = ["pistol"];
            currentWeaponKey = "pistol";
            updateGunVisual();
            renderShop();
            document.getElementById('hp-val').innerText = hp; 
            document.getElementById('score-val').innerText = score; 
            document.getElementById('money-val').innerText = money; 
            isGameOver = false; 
            clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnZombie, 1800);
        }
        
        function onWindowResize() { if(camera && renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } }
    </script>
</body>
</html>
