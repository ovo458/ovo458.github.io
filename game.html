<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 城市殭屍大戰</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            user-select: none;
            touch-action: none;
        }
        #auth-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #141416;
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #f1c40f;
            width: 300px;
            color: white;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        .auth-box h2 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #f1c40f;
            letter-spacing: 2px;
        }
        .auth-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #34495e;
            border-radius: 5px;
            background: #1a252f;
            color: white;
            box-sizing: border-box;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #f1c40f;
            color: #2c3e50;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #bdc3c7;
            cursor: pointer;
            text-decoration: underline;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 20;
        }
        #logout-btn {
            margin-top: 5px;
            padding: 4px 10px;
            background: #e74c3c;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        #weapon-info {
            margin-top: 8px;
            color: #f1c40f;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 4px;
            display: inline-block;
        }
        #inventory-container {
            margin-top: 8px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #3498db;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .inv-slot {
            background: #2c3e50;
            border: 2px solid #3498db;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #fff;
        }
        .inv-slot:hover {
            background: #2980b9;
        }
        #leaderboard-container {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #2ecc71;
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            font-size: 14px;
            min-width: 180px;
            z-index: 20;
        }
        #leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            margin-bottom: 8px;
        }
        #leaderboard-container h3 {
            margin: 0;
            font-size: 14px;
            color: #2ecc71;
        }
        #toggle-lb-btn {
            background: #27ae60;
            border: 1px solid white;
            color: white;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        #shop-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #ff5722;
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #shop-ui {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 15px;
            padding: 20px;
            color: white;
            z-index: 200;
            width: 340px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        #shop-ui h2 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #f1c40f;
        }
        #shop-items-list {
            max-height: 280px;
            overflow-y: auto;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.06);
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .shop-item-info {
            display: flex;
            flex-direction: column;
        }
        .shop-item-title {
            font-weight: bold;
            font-size: 15px;
        }
        .shop-item-cost {
            font-size: 12px;
            color: #bdc3c7;
            margin-top: 2px;
        }
        .buy-btn {
            padding: 6px 14px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-btn.owned {
            background: #34495e;
            color: #7f8c8d;
            cursor: default;
        }
        #close-shop {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            border: 2px solid #2ecc71;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #2ecc71;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #mobile-controls {
            display: none;
        }
        #move-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 50;
        }
        #joystick {
            position: absolute;
            top: 50%; left: 50%;
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #action-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            z-index: 60;
        }
        #jump-btn {
            width: 70px; height: 70px;
            background: rgba(44, 62, 80, 0.8);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: white; font-weight: bold; font-size: 16px;
            display: flex; justify-content: center; align-items: center;
        }
        #shoot-btn {
            width: 95px; height: 95px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; font-size: 20px;
        }
        #pc-hint {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c; font-size: 36px; font-weight: bold; text-align: center;
            background: rgba(0,0,0,0.9); padding: 25px; border-radius: 15px; z-index: 100;
            border: 2px solid #e74c3c;
        }
        #hit-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(231, 76, 60, 0);
            pointer-events: none;
            z-index: 2;
            transition: background 0.1s ease;
        }
        #admin-menu {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.95);
            border: 3px dashed #e74c3c;
            border-radius: 12px;
            padding: 20px;
            color: #ffffff;
            z-index: 300;
            width: 280px;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.5);
            text-align: center;
        }
        #admin-menu h2 {
            margin: 0 0 15px 0;
            color: #e74c3c;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .admin-btn {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #e74c3c;
            background: #2c3e50;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .admin-btn:hover {
            background: #e74c3c;
        }
        .admin-btn.active {
            background: #2ecc71;
            border-color: #2ecc71;
        }
        #close-admin {
            background: #7f8c8d;
            border: none;
            margin-top: 10px;
        }
        #wave-announcement {
            position: absolute;
            top: 30%; left: 50%;
            transform: translate(-50%, -50%);
            color: #f1c40f;
            font-size: 42px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            z-index: 15;
            pointer-events: none;
            display: none;
            text-align: center;
        }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <div id="hit-overlay"></div>
    <div id="wave-announcement">WAVE 1</div>

    <div id="auth-screen">
        <div class="auth-box" id="auth-login">
            <h2>玩家登入</h2>
            <input type="text" id="login-user" placeholder="輸入帳號">
            <input type="password" id="login-pass" placeholder="輸入密碼">
            <button onclick="handleAuth('login')">進入戰場</button>
            <div class="auth-toggle" onclick="toggleAuth(false)">沒有帳號？立即註冊</div>
        </div>
        <div class="auth-box" id="auth-register" style="display:none;">
            <h2>新兵註冊</h2>
            <input type="text" id="reg-user" placeholder="創建新帳號 (最多16字)">
            <input type="password" id="reg-pass" placeholder="創建新密碼 (最少4字)">
            <button onclick="handleAuth('register')">完成註冊</button>
            <div class="auth-toggle" onclick="toggleAuth(true)">已有帳號？返回登入</div>
        </div>
    </div>

    <div id="admin-menu">
        <h2>🛠️ 核心管理員外掛菜單</h2>
        <button class="admin-btn" onclick="adminAddMoney()">💰 瞬間增加 10000 金幣</button>
        <button class="admin-btn" id="adm-god-btn" onclick="adminToggleGodMode()">🛡️ 無敵模式: 關閉</button>
        <button class="admin-btn" id="adm-fly-btn" onclick="adminToggleFlyMode()">🦅 自由飛行模式: 關閉</button>
        <button class="admin-btn" id="close-admin" onclick="closeAdminMenu()">關閉選單</button>
    </div>

    <div id="ui-container">
        <div>目前玩家: <span id="current-name-val">未登入</span></div>
        <div style="font-size: 20px; color: #f1c40f; margin: 3px 0;">目前波數: 第 <span id="wave-val">1</span> 波</div>
        <div>場上剩餘殭屍: <span id="zombie-left-val">0</span> 隻</div>
        <div>金幣: $<span id="money-val">0</span></div>
        <div>生命值: <span id="hp-val">100</span>%</div>
        <button id="logout-btn" onclick="logout()">登出帳號</button>
        <br>
        <div id="weapon-info">武器: 未載入</div>
        <div id="inventory-container">
            <span>🎒 道具欄:</span>
            <div class="inv-slot" id="medkit-slot" onclick="useMedkit(event)">➕ 醫療包 (x0)</div>
        </div>
    </div>

    <button id="shop-btn" onclick="openShop(event)">🛒 武器商店</button>

    <div id="shop-ui">
        <h2>🛒 武器軍火庫</h2>
        <div id="shop-items-list"></div>
        <button id="close-shop" onclick="closeShop(event)">關閉商店</button>
    </div>

    <div id="leaderboard-container">
        <div id="leaderboard-header">
            <h3 id="lb-title-text">🏆 最高波數排行</h3>
            <button id="toggle-lb-btn" onclick="toggleLeaderboardType(event)">切換金幣榜</button>
        </div>
        <div id="leaderboard-list"></div>
    </div>

    <div id="crosshair"></div>
    <div id="pc-hint">點擊畫面鎖定視角 (B鍵商店/H鍵補血/ESC釋放滑鼠)</div>

    <div id="mobile-controls">
        <div id="move-zone"><div id="joystick"></div></div>
        <div id="action-container">
            <div id="jump-btn">JUMP</div>
            <div id="shoot-btn">FIRE</div>
        </div>
    </div>

    <div id="game-over">
        你陣亡了...
        <button onclick="resetGame()" style="margin-top:15px; padding:10px 25px; background:#2ecc71; color:white; border:none; border-radius:5px; cursor:pointer;">重新出擊</button>
    </div>

    <script>
        let scene, camera, renderer;
        let ambientLight, dirLight;
        let zombies = [], bullets = [];
        let hp = 100, money = 0, isGameOver = false;
        let gunGroup, muzzleFlash;
        
        let currentWave = 1;
        let zombiesToSpawnThisWave = 0;
        let zombiesSpawnedSoFar = 0;
        let waveSpawnInterval = null;
        let isWaveTransition = false;

        let medkitCount = 0;
        let currentLbType = "wave"; 

        let cameraAngleX = 0, cameraAngleY = 0; 
        let moveDirection = { x: 0, z: 0 }; 
        
        let kbState = { w: 0, s: 0, a: 0, d: 0, shift: 0 };
        const mouseSensitivity = 0.0022;
        const playerSpeed = 0.16;

        let moveTouchId = null, moveStart = { x: 0, y: 0 };
        let lookTouchId = null, lookLast = { x: 0, y: 0 };

        let playerVelocityY = 0, isJumping = false;
        const gravity = -0.012, jumpStrength = 0.26, defaultPlayerHeight = 1.6;
        let walkTime = 0;

        let isShopOpen = false;
        let isAdminOpen = false;
        let isMouseDown = false;
        let lastShotTime = 0;
        let currentAccount = null;

        let godMode = false;
        let flyMode = false;

        const secretCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowLeft', 'ArrowRight', 'ArrowRight'];
        const alternativeCode = ['KeyW', 'KeyW', 'KeyS', 'KeyS', 'KeyA', 'KeyA', 'KeyD', 'KeyD'];
        let codeProgress = [];

        const weapons = {
            glock: { name: "Glock 手槍", cost: 0, dmg: 1, delay: 300, auto: false, parts: [{w:0.04, h:0.04, d:0.18, x:0, y:0, z:-0.09, c:0x2c3e50},{w:0.035, h:0.08, d:0.04, x:0, y:-0.05, z:-0.04, c:0x1e272e}] },
            mp5: { name: "MP5 衝鋒槍", cost: 120, dmg: 1.2, delay: 110, auto: true, parts: [{w:0.04, h:0.06, d:0.35, x:0, y:0, z:-0.18, c:0x2f3640},{w:0.03, h:0.03, d:0.15, x:0, y:0, z:-0.4, c:0x718093},{w:0.03, h:0.07, d:0.04, x:0, y:-0.06, z:-0.1, c:0x1e272e},{w:0.03, h:0.05, d:0.12, x:0, y:-0.02, z:-0.02, c:0x2f3640}] },
            ak47: { name: "AK-47 突擊步槍", cost: 350, dmg: 2.8, delay: 140, auto: true, parts: [{w:0.04, h:0.07, d:0.45, x:0, y:0, z:-0.22, c:0x2c3e50},{w:0.03, h:0.03, d:0.25, x:0, y:0.01, z:-0.55, c:0xdcdde1},{w:0.035, h:0.06, d:0.2, x:0, y:-0.01, z:-0.2, c:0xcd6133},{w:0.03, h:0.08, d:0.18, x:0, y:-0.04, z:0.08, c:0xcd6133}] },
            awp: { name: "AWP 狙擊步槍", cost: 800, dmg: 10, delay: 1200, auto: false, parts: [{w:0.05, h:0.08, d:0.6, x:0, y:0, z:-0.3, c:0x218c74},{w:0.025, h:0.025, d:0.5, x:0, y:0.02, z:-0.8, c:0x2c3e50},{w:0.03, h:0.06, d:0.06, x:0, y:0.07, z:-0.25, c:0x2c3e50},{w:0.04, h:0.06, d:0.25, x:0, y:-0.03, z:0.1, c:0x218c74}] },
            m134: { name: "M134 迷你砲機槍", cost: 1500, dmg: 2.0, delay: 40, auto: true, parts: [{w:0.12, h:0.12, d:0.3, x:0, y:0, z:-0.15, c:0x2c3e50},{w:0.07, h:0.07, d:0.45, x:0, y:0, z:-0.5, c:0x1e272e},{w:0.02, h:0.02, d:0.45, x:0.02, y:0.02, z:-0.5, c:0x718093},{w:0.02, h:0.02, d:0.45, x:-0.02, y:-0.02, z:-0.5, c:0x718093}] }
        };
        let ownedWeapons = ["glock"];
        let currentWeaponKey = "glock";

        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

        function toggleAuth(showLogin) {
            if (showLogin) {
                document.getElementById('auth-login').style.display = 'block';
                document.getElementById('auth-register').style.display = 'none';
            } else {
                document.getElementById('auth-login').style.display = 'none';
                document.getElementById('auth-register').style.display = 'block';
            }
        }

        function handleAuth(type) {
            let user, pass;
            if (type === 'register') {
                user = document.getElementById('reg-user').value.trim();
                pass = document.getElementById('reg-pass').value.trim();
            } else {
                user = document.getElementById('login-user').value.trim();
                pass = document.getElementById('login-pass').value.trim();
            }

            if (!user || !pass) { 
                alert("錯誤：請填寫完整的帳號與密碼欄位！"); 
                return; 
            }

            let db = JSON.parse(localStorage.getItem('game_accounts') || '{}');

            if (type === 'register') {
                if (user.length > 16) { 
                    alert("註冊失敗：帳號長度不可超過 16 個字！"); 
                    return; 
                }
                if (pass.length < 4) { 
                    alert("註冊失敗：密碼長度至少需要 4 個字以上！"); 
                    return; 
                }
                if (db[user]) { 
                    alert("註冊失敗：此帳號已被註冊，請換一個名字。"); 
                    return; 
                }

                db[user] = { password: pass, money: 0, owned: ["glock"], current: "glock", medkits: 0 };
                localStorage.setItem('game_accounts', JSON.stringify(db));
                alert("🎉 註冊成功！請返回登入畫面。");
                document.getElementById('reg-user').value = '';
                document.getElementById('reg-pass').value = '';
                toggleAuth(true);
            } else {
                if (!db[user] || db[user].password !== pass) { 
                    alert("登入失敗：帳號不存在或密碼錯誤！"); 
                    return; 
                }
                currentAccount = user;
                money = db[user].money || 0;
                ownedWeapons = db[user].owned || ["glock"];
                currentWeaponKey = db[user].current || "glock";
                medkitCount = db[user].medkits || 0;

                document.getElementById('current-name-val').innerText = currentAccount;
                document.getElementById('money-val').innerText = money;
                updateInventoryUI();
                
                initGameEngine();
                document.getElementById('auth-screen').style.display = 'none';
                setTimeout(onWindowResize, 50);
            }
        }

        function saveUserData() {
            if (!currentAccount) return;
            let db = JSON.parse(localStorage.getItem('game_accounts') || '{}');
            if (db[currentAccount]) {
                db[currentAccount].money = money;
                db[currentAccount].owned = ownedWeapons;
                db[currentAccount].current = currentWeaponKey;
                db[currentAccount].medkits = medkitCount;
                localStorage.setItem('game_accounts', JSON.stringify(db));
            }
        }

        function logout() {
            saveUserData();
            location.reload();
        }

        function initGameEngine() {
            if (typeof THREE === 'undefined' || scene) return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa5b1c2); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, defaultPlayerHeight, 0); 
            scene.add(camera); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, depth: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio || 1); 
            document.body.appendChild(renderer.domElement);

            const gridHelper = new THREE.GridHelper(500, 100, 0x7f8c8d, 0x95a5a6);
            scene.add(gridHelper);

            ambientLight = new THREE.AmbientLight(0xffffff, 1.2); 
            scene.add(ambientLight);
            dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(30, 60, 30);
            scene.add(dirLight);

            for (let i = 0; i < 45; i++) {
                let h = 12 + Math.random() * 25;
                const bGeo = new THREE.BoxGeometry(8, h, 8);
                const bMat = new THREE.MeshStandardMaterial({ color: 0x57606f, roughness: 0.5 });
                const building = new THREE.Mesh(bGeo, bMat);
                let angle = Math.random() * Math.PI * 2;
                let radius = 25 + Math.random() * 80;
                building.position.set(Math.cos(angle) * radius, h / 2, Math.sin(angle) * radius);
                scene.add(building);
            }

            createGunSystem();
            
            if (isMobile) {
                document.getElementById('mobile-controls').style.display = 'block';
                setupMobileControls();
            } else {
                document.getElementById('pc-hint').style.display = 'block';
                setupPCControls();
            }

            updateLeaderboardUI();
            renderShop();
            window.addEventListener('resize', onWindowResize);
            
            startWave(1);
            animate();
        }

        function startWave(waveNum) {
            isWaveTransition = false;
            currentWave = waveNum;
            zombiesSpawnedSoFar = 0;
            zombiesToSpawnThisWave = 4 + currentWave * 2; 
            
            document.getElementById('wave-val').innerText = currentWave;
            document.getElementById('zombie-left-val').innerText = zombiesToSpawnThisWave;

            const announce = document.getElementById('wave-announcement');
            announce.innerText = `第 ${currentWave} 波 開始`;
            announce.style.display = 'block';
            setTimeout(() => { announce.style.display = 'none'; }, 2000);

            if (waveSpawnInterval) clearInterval(waveSpawnInterval);
            waveSpawnInterval = setInterval(() => {
                if (isGameOver || isShopOpen || isAdminOpen || !currentAccount) return;
                if (zombiesSpawnedSoFar < zombiesToSpawnThisWave) {
                    spawnZombie();
                    zombiesSpawnedSoFar++;
                } else {
                    clearInterval(waveSpawnInterval);
                }
            }, 1200);
        }

        function checkWaveStatus() {
            if (isWaveTransition || isGameOver) return;
            
            let totalRemaining = (zombiesToSpawnThisWave - zombiesSpawnedSoFar) + zombies.length;
            document.getElementById('zombie-left-val').innerText = totalRemaining;

            if (zombiesSpawnedSoFar >= zombiesToSpawnThisWave && zombies.length === 0) {
                isWaveTransition = true;
                money += 50 + currentWave * 10; 
                document.getElementById('money-val').innerText = money;
                saveUserData();

                const announce = document.getElementById('wave-announcement');
                announce.innerText = `第 ${currentWave} 波 清理完畢\n下波即將開始...`;
                announce.style.display = 'block';

                setTimeout(() => {
                    startWave(currentWave + 1);
                }, 3500);
            }
        }

        function updateInventoryUI() {
            document.getElementById('medkit-slot').innerText = `➕ 醫療包 (x${medkitCount})`;
        }

        function useMedkit(e) {
            if(e) e.stopPropagation();
            if (isGameOver || !currentAccount) return;
            if (medkitCount <= 0) { alert("你沒有醫療包了！請先去商店購買。"); return; }
            if (hp >= 100) { alert("生命值已滿，不需要使用醫療包！"); return; }
            
            medkitCount--;
            hp = Math.min(100, hp + 50);
            document.getElementById('hp-val').innerText = hp;
            updateInventoryUI();
            saveUserData();
        }

        function checkSecretCode(key) {
            codeProgress.push(key);
            let targetKey = secretCode[codeProgress.length - 1];
            let altTargetKey = alternativeCode[codeProgress.length - 1];
            
            if (key !== targetKey && key !== altTargetKey) {
                codeProgress = (key === secretCode[0] || key === alternativeCode[0]) ? [key] : [];
                return;
            }
            if (codeProgress.length === secretCode.length) {
                codeProgress = [];
                openAdminMenu();
            }
        }

        function openAdminMenu() {
            isAdminOpen = true;
            document.getElementById('admin-menu').style.display = 'block';
            document.exitPointerLock();
        }

        function closeAdminMenu() {
            isAdminOpen = false;
            document.getElementById('admin-menu').style.display = 'none';
        }

        function adminAddMoney() {
            money += 10000;
            document.getElementById('money-val').innerText = money;
            saveUserData();
            renderShop();
        }

        function adminToggleGodMode() {
            godMode = !godMode;
            const btn = document.getElementById('adm-god-btn');
            if (godMode) {
                btn.innerText = "🛡️ 無敵模式: 開啟中";
                btn.classList.add('active');
                hp = 100;
                document.getElementById('hp-val').innerText = hp;
            } else {
                btn.innerText = "🛡️ 無敵模式: 關閉";
                btn.classList.remove('active');
            }
        }

        function adminToggleFlyMode() {
            flyMode = !flyMode;
            const btn = document.getElementById('adm-fly-btn');
            if (flyMode) {
                btn.innerText = "🦅 自由飛行模式: 開啟中";
                btn.classList.add('active');
                isJumping = false; playerVelocityY = 0;
            } else {
                btn.innerText = "🦅 自由飛行模式: 關閉";
                btn.classList.remove('active');
                if (camera.position.y > defaultPlayerHeight) isJumping = true;
            }
        }

        function createGunSystem() {
            gunGroup = new THREE.Group();
            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff200, transparent: true, opacity: 0 }));
            gunGroup.add(muzzleFlash);
            gunGroup.position.set(0.2, -0.25, -0.4);
            camera.add(gunGroup); 
            updateGunVisual();
        }

        function updateGunVisual() {
            if (!gunGroup) return;
            for (let i = gunGroup.children.length - 1; i >= 0; i--) {
                if (gunGroup.children[i] !== muzzleFlash) gunGroup.remove(gunGroup.children[i]);
            }
            const w = weapons[currentWeaponKey];
            let maxDepth = 0;
            w.parts.forEach(p => {
                const geo = new THREE.BoxGeometry(p.w, p.h, p.d);
                const mat = new THREE.MeshStandardMaterial({ color: p.c, roughness: 0.5 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(p.x, p.y, p.z);
                gunGroup.add(mesh);
                let tipPos = Math.abs(p.z) + p.d / 2;
                if (tipPos > maxDepth) maxDepth = tipPos;
            });
            muzzleFlash.position.set(0, 0.01, -maxDepth);
            document.getElementById('weapon-info').innerText = `武器: ${w.name} (${w.auto ? "連發" : "單發"})`;
        }

        function setupPCControls() {
            const canvasElement = document.body;
            window.addEventListener('click', (e) => {
                if (!isGameOver && !isShopOpen && !isAdminOpen && currentAccount !== null && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && !e.target.classList.contains('inv-slot')) {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === canvasElement && !isGameOver && !isShopOpen && !isAdminOpen) {
                    cameraAngleX -= e.movementX * mouseSensitivity;
                    cameraAngleY = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, cameraAngleY - e.movementY * mouseSensitivity));
                    camera.quaternion.setFromEuler(new THREE.Euler(cameraAngleY, cameraAngleX, 0, 'YXZ'));
                }
            });

            window.addEventListener('keydown', (e) => {
                checkSecretCode(e.code);
                if (isGameOver || !currentAccount) return;
                if (e.code === 'KeyW') kbState.w = 1;
                if (e.code === 'KeyS') kbState.s = 1;
                if (e.code === 'KeyA') kbState.a = 1;
                if (e.code === 'KeyD') kbState.d = 1;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') kbState.shift = 1;
                if (e.code === 'Space') { if (!flyMode) jump(); }
                if (e.code === 'KeyB') { if (isShopOpen) closeShop(); else openShop(); }
                if (e.code === 'KeyH') { useMedkit(); }
                updatePCMoveDirection();
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') kbState.w = 0;
                if (e.code === 'KeyS') kbState.s = 0;
                if (e.code === 'KeyA') kbState.a = 0;
                if (e.code === 'KeyD') kbState.d = 0;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') kbState.shift = 0;
                updatePCMoveDirection();
            });

            window.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement === canvasElement && e.button === 0 && !isGameOver && !isShopOpen && !isAdminOpen) {
                    isMouseDown = true; triggerShoot();
                }
            });
            window.addEventListener('mouseup', (e) => { if (e.button === 0) isMouseDown = false; });
        }

        function updatePCMoveDirection() {
            moveDirection.x = kbState.d - kbState.a;
            moveDirection.z = kbState.s - kbState.w;
        }

        function setupMobileControls() {
            const shootBtn = document.getElementById('shoot-btn');
            const jumpBtn = document.getElementById('jump-btn');

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (e.target === shootBtn) { isMouseDown = true; triggerShoot(); continue; }
                    if (e.target === jumpBtn) { if (!flyMode) jump(); continue; }
                    if (t.clientX < window.innerWidth / 2 && moveTouchId === null) {
                        moveTouchId = t.identifier; moveStart.x = t.clientX; moveStart.y = t.clientY; continue;
                    }
                    if (t.clientX >= window.innerWidth / 2 && lookTouchId === null && !isShopOpen && !isAdminOpen) {
                        lookTouchId = t.identifier; lookLast.x = t.clientX; lookLast.y = t.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const t = e.touches[i];
                    if (t.identifier === moveTouchId) {
                        let dx = t.clientX - moveStart.x; let dy = t.clientY - moveStart.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
                        document.getElementById('joystick').style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        moveDirection.x = dx / 40; moveDirection.z = dy / 40;
                    }
                    if (t.identifier === lookTouchId) {
                        cameraAngleX -= (t.clientX - lookLast.x) * 0.005;
                        cameraAngleY = Math.max(-Math.PI/2.3, Math.min(Math.PI/2.3, cameraAngleY - (t.clientY - lookLast.y) * 0.005));
                        camera.quaternion.setFromEuler(new THREE.Euler(cameraAngleY, cameraAngleX, 0, 'YXZ'));
                        lookLast.x = t.clientX; lookLast.y = t.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === moveTouchId) { 
                        moveTouchId = null; document.getElementById('joystick').style.transform = 'translate(-50%, -50%)'; 
                        moveDirection.x = 0; moveDirection.z = 0; 
                    }
                    if (t.identifier === lookTouchId) lookTouchId = null;
                    if (e.target === shootBtn) isMouseDown = false;
                }
            });
        }

        function openShop(e) { if(e) e.stopPropagation(); isShopOpen = true; document.getElementById('shop-ui').style.display = 'block'; document.exitPointerLock(); }
        function closeShop(e) { if(e) e.stopPropagation(); isShopOpen = false; document.getElementById('shop-ui').style.display = 'none'; }

        function renderShop() {
            const listContainer = document.getElementById('shop-items-list'); listContainer.innerHTML = '';
            
            const medkitDiv = document.createElement('div'); medkitDiv.className = 'shop-item';
            medkitDiv.innerHTML = `
                <div class="shop-item-info">
                    <span class="shop-item-title">➕ 醫療包 (恢復50% HP)</span>
                    <span class="shop-item-cost">價格: $50</span>
                </div>
                <button class="buy-btn" onclick="buyMedkit(event)">購買</button>
            `;
            listContainer.appendChild(medkitDiv);

            Object.keys(weapons).forEach(key => {
                const w = weapons[key]; const itemDiv = document.createElement('div'); itemDiv.className = 'shop-item';
                let btnText = ownedWeapons.includes(key) ? "裝備" : `$${w.cost}`; let btnClass = "buy-btn";
                if (currentWeaponKey === key) { btnText = "使用中"; btnClass = "buy-btn owned"; }
                itemDiv.innerHTML = `
                    <div class="shop-item-info">
                        <span class="shop-item-title">${w.name}</span>
                        <span class="shop-item-cost">威力: ${w.dmg} | 延遲: ${w.delay}ms</span>
                    </div>
                    <button class="${btnClass}" onclick="buyOrEquip('${key}', event)">${btnText}</button>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        function buyMedkit(e) {
            e.stopPropagation();
            if (money >= 50) {
                money -= 50;
                medkitCount++;
                document.getElementById('money-val').innerText = money;
                updateInventoryUI();
                saveUserData();
            } else {
                alert("金幣不足！需要 $50。");
            }
        }

        function buyOrEquip(key, e) {
            e.stopPropagation(); const w = weapons[key];
            if (ownedWeapons.includes(key)) {
                currentWeaponKey = key; updateGunVisual(); renderShop(); saveUserData();
            } else {
                if (money >= w.cost) {
                    money -= w.cost; document.getElementById('money-val').innerText = money;
                    ownedWeapons.push(key); currentWeaponKey = key; updateGunVisual(); renderShop(); saveUserData();
                } else { alert("金幣不足！"); }
            }
        }

        function jump() { if (!isJumping && !isGameOver && !isShopOpen && !isAdminOpen) { isJumping = true; playerVelocityY = jumpStrength; } }

        function triggerShoot() {
            if (isGameOver || isShopOpen || isAdminOpen || !currentAccount) return;
            let now = performance.now(); let w = weapons[currentWeaponKey];
            if (now - lastShotTime >= w.delay) { shoot(w); lastShotTime = now; }
        }

        function shoot(w) {
            muzzleFlash.material.opacity = 1; gunGroup.position.z = -0.36; 
            setTimeout(() => { muzzleFlash.material.opacity = 0; gunGroup.position.z = -0.4; }, 40);
            const gunWorldPos = new THREE.Vector3(); muzzleFlash.getWorldPosition(gunWorldPos);
            const baseDir = new THREE.Vector3(); camera.getWorldDirection(baseDir);
            let spread = currentWeaponKey === 'awp' ? 0.001 : (currentWeaponKey === 'm134' ? 0.04 : 0.015);
            createBulletMesh(gunWorldPos, baseDir, spread, w.dmg);
        }

        function createBulletMesh(pos, baseDir, spread, dmg) {
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), new THREE.MeshBasicMaterial({ color: 0xfff200 }));
            bullet.position.copy(pos); let dir = baseDir.clone();
            dir.x += (Math.random() - 0.5) * spread; dir.y += (Math.random() - 0.5) * spread; dir.z += (Math.random() - 0.5) * spread;
            dir.normalize(); bullet.userData = { dir: dir, dmg: dmg, born: performance.now() };
            scene.add(bullet); bullets.push(bullet);
        }

        function spawnZombie() {
            if (isGameOver || isShopOpen || isAdminOpen || !currentAccount) return;
            const zombieGroup = new THREE.Group();
            
            let hpMax = 1 + currentWave * 0.05; 
            let zombieSpeed = 0.075 + currentWave * 0.003; 

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x445433, roughness: 0.8 }));
            body.position.y = 0.6; zombieGroup.add(body);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), new THREE.MeshStandardMaterial({ color: 0x10ac84, roughness: 0.7 }));
            head.position.y = 1.25; zombieGroup.add(head);
            let angle = Math.random() * Math.PI * 2; let distance = 30 + Math.random() * 15;
            zombieGroup.position.set(camera.position.x + Math.cos(angle)*distance, 0, camera.position.z + Math.sin(angle)*distance);
            zombieGroup.userData = { hp: hpMax, speed: zombieSpeed };
            scene.add(zombieGroup); zombies.push(zombieGroup);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver || !currentAccount) return;

            if (godMode) { hp = 100; document.getElementById('hp-val').innerText = hp; }
            if (weapons[currentWeaponKey].auto && isMouseDown) triggerShoot();

            if (flyMode && document.pointerLockElement) {
                if (kbState.w && cameraAngleY > 0.3) camera.position.y += 0.08;
                if (kbState.w && cameraAngleY < -0.3) camera.position.y -= 0.08;
            } else if (!flyMode) {
                if (isJumping) {
                    playerVelocityY += gravity; camera.position.y += playerVelocityY;
                    if (camera.position.y <= defaultPlayerHeight) { camera.position.y = defaultPlayerHeight; isJumping = false; playerVelocityY = 0; }
                }
            }

            if ((moveDirection.x !== 0 || moveDirection.z !== 0) && !isShopOpen && !isAdminOpen) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); 
                if(!flyMode) forward.y = 0;
                forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); 
                right.y = 0; right.normalize();
                let mag = Math.sqrt(moveDirection.x*moveDirection.x + moveDirection.z*moveDirection.z);
                camera.position.addScaledVector(forward, -(moveDirection.z / mag) * playerSpeed * Math.min(1, mag));
                camera.position.addScaledVector(right, (moveDirection.x / mag) * playerSpeed * Math.min(1, mag));

                walkTime += 0.25;
                gunGroup.position.y = -0.25 + Math.sin(walkTime) * 0.012;
                gunGroup.position.x = 0.2 + Math.cos(walkTime) * 0.008;
            }

            let now = performance.now();
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.position.addScaledVector(b.userData.dir, 1.6);
                if (now - b.userData.born > 1200) { scene.remove(b); bullets.splice(i, 1); continue; }
                for (let j = zombies.length - 1; j >= 0; j--) {
                    const z = zombies[j];
                    if (b.position.distanceTo(z.position.clone().setY(z.position.y + 0.8)) < 1.2) {
                        z.userData.hp -= b.userData.dmg; scene.remove(b); bullets.splice(i, 1);
                        if (z.userData.hp <= 0) {
                            scene.remove(z); zombies.splice(j, 1); money += 10 + Math.floor(Math.random() * 11);
                            document.getElementById('money-val').innerText = money;
                            saveUserData();
                            checkWaveStatus();
                        }
                        break;
                    }
                }
            }

            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j]; const dir = new THREE.Vector3().copy(camera.position).sub(z.position); dir.y = 0; dir.normalize();
                if (!isShopOpen && !isAdminOpen) z.position.addScaledVector(dir, z.userData.speed);
                z.lookAt(camera.position.x, z.position.y, camera.position.z);
                
                if (z.position.distanceTo(new THREE.Vector3(camera.position.x, z.position.y, camera.position.z)) < 1.8) {
                    scene.remove(z); zombies.splice(j, 1);
                    if (!godMode) {
                        hp -= 25; document.getElementById('hp-val').innerText = Math.max(0, hp);
                        const overlay = document.getElementById('hit-overlay'); overlay.style.backgroundColor = 'rgba(231, 76, 60, 0.4)';
                        setTimeout(() => overlay.style.backgroundColor = 'rgba(231, 76, 60, 0)', 100);
                        if (hp <= 0) { endGame(); } else { checkWaveStatus(); }
                    }
                }
            }
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        function getLeaderboard(type) { 
            if (type === "wave") {
                const data = localStorage.getItem('zombie_city_wave_scores'); 
                return data ? JSON.parse(data) : [{name: "傳奇老兵", score: 10}, {name: "倖存者", score: 3}];
            } else {
                const data = localStorage.getItem('zombie_city_money_scores'); 
                return data ? JSON.parse(data) : [{name: "金幣大亨", score: 5000}, {name: "拾荒者", score: 200}];
            }
        }

        function toggleLeaderboardType(e) {
            if(e) e.stopPropagation();
            if (currentLbType === "wave") {
                currentLbType = "money";
                document.getElementById('lb-title-text').innerText = "💰 富豪金幣排行";
                document.getElementById('toggle-lb-btn').innerText = "切換波數榜";
            } else {
                currentLbType = "wave";
                document.getElementById('lb-title-text').innerText = "🏆 最高波數排行";
                document.getElementById('toggle-lb-btn').innerText = "切換金幣榜";
            }
            updateLeaderboardUI();
        }

        function updateLeaderboardUI() {
            const container = document.getElementById('leaderboard-list'); if(!container) return; container.innerHTML = '';
            const suffix = currentLbType === "wave" ? "波" : "元";
            const prefix = currentLbType === "wave" ? "第 " : "$";
            
            getLeaderboard(currentLbType).forEach((item, index) => {
                const div = document.createElement('div'); div.className = 'leaderboard-item';
                if(currentLbType === "wave") {
                    div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${prefix}${item.score} ${suffix}</span>`;
                } else {
                    div.innerHTML = `<span>${index + 1}. ${item.name}</span><span>${prefix}${item.score}</span>`;
                }
                container.appendChild(div);
            });
        }

        function endGame() {
            isGameOver = true; document.getElementById('game-over').style.display = 'block'; 
            if (waveSpawnInterval) clearInterval(waveSpawnInterval); 
            document.exitPointerLock(); saveUserData();
            
            let waveList = getLeaderboard("wave");
            let existingWaveUser = waveList.find(item => item.name === currentAccount);
            if (existingWaveUser) {
                if (currentWave > existingWaveUser.score) {
                    existingWaveUser.score = currentWave;
                }
            } else {
                waveList.push({ name: currentAccount, score: currentWave });
            }
            waveList.sort((a, b) => b.score - a.score);
            waveList = waveList.slice(0, 3);
            localStorage.setItem('zombie_city_wave_scores', JSON.stringify(waveList));

            let moneyList = getLeaderboard("money");
            let existingMoneyUser = moneyList.find(item => item.name === currentAccount);
            if (existingMoneyUser) {
                if (money > existingMoneyUser.score) {
                    existingMoneyUser.score = money;
                }
            } else {
                moneyList.push({ name: currentAccount, score: money });
            }
            moneyList.sort((a, b) => b.score - a.score);
            moneyList = moneyList.slice(0, 3);
            localStorage.setItem('zombie_city_money_scores', JSON.stringify(moneyList));

            updateLeaderboardUI();
        }

        function resetGame() { 
            zombies.forEach(z => scene.remove(z)); bullets.forEach(b => scene.remove(b)); zombies = []; bullets = [];
            camera.position.set(0, defaultPlayerHeight, 0); cameraAngleX = 0; cameraAngleY = 0; camera.quaternion.set(0, 0, 0, 1);
            document.getElementById('game-over').style.display = 'none'; hp = 100; 
            document.getElementById('hp-val').innerText = hp; 
            isGameOver = false; 
            startWave(1);
        }
        function onWindowResize() { if(camera && renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } }
    </script>
</body>
</html>
