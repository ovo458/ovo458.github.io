<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 城市殭屍大戰</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111116;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            user-select: none;
            touch-action: none;
        }
        #auth-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #141416;
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #f1c40f;
            width: 300px;
            color: white;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        .auth-box h2 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #f1c40f;
            letter-spacing: 2px;
        }
        .auth-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #34495e;
            border-radius: 5px;
            background: #1a252f;
            color: white;
            box-sizing: border-box;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #f1c40f;
            color: #2c3e50;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #bdc3c7;
            cursor: pointer;
            text-decoration: underline;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 20;
        }
        #logout-btn {
            margin-top: 5px;
            padding: 4px 10px;
            background: #e74c3c;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        #weapon-info {
            margin-top: 8px;
            color: #f1c40f;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 4px;
            display: inline-block;
        }
        #leaderboard-container {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #2ecc71;
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            font-size: 14px;
            min-width: 150px;
            z-index: 20;
        }
        #leaderboard-container h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #2ecc71;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        #shop-btn {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #ff5722;
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #shop-ui {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 15px;
            padding: 20px;
            color: white;
            z-index: 200;
            width: 340px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        #shop-ui h2 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #f1c40f;
        }
        #shop-items-list {
            max-height: 280px;
            overflow-y: auto;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.06);
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .shop-item-info {
            display: flex;
            flex-direction: column;
        }
        .shop-item-title {
            font-weight: bold;
            font-size: 15px;
        }
        .shop-item-cost {
            font-size: 12px;
            color: #bdc3c7;
            margin-top: 2px;
        }
        .buy-btn {
            padding: 6px 14px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-btn.owned {
            background: #34495e;
            color: #7f8c8d;
            cursor: default;
        }
        #close-shop {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            border: 2px solid #2ecc71;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #2ecc71;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #mobile-controls {
            display: none;
        }
        #move-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 50;
        }
        #joystick {
            position: absolute;
            top: 50%; left: 50%;
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #action-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            z-index: 60;
        }
        #jump-btn {
            width: 70px; height: 70px;
            background: rgba(44, 62, 80, 0.8);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: white; font-weight: bold; font-size: 16px;
            display: flex; justify-content: center; align-items: center;
        }
        #shoot-btn {
            width: 95px; height: 95px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; font-size: 20px;
        }
        #pc-hint {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c; font-size: 36px; font-weight: bold; text-align: center;
            background: rgba(0,0,0,0.9); padding: 25px; border-radius: 15px; z-index: 100;
            border: 2px solid #e74c3c;
        }
        #hit-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(231, 76, 60, 0);
            pointer-events: none;
            z-index: 2;
            transition: background 0.1s ease;
        }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <div id="hit-overlay"></div>

    <div id="auth-screen">
        <div class="auth-box" id="auth-login">
            <h2>玩家登入</h2>
            <input type="text" id="login-user" placeholder="帳號">
            <input type="password" id="login-pass" placeholder="密碼">
            <button onclick="handleAuth('login')">進入戰場</button>
            <div class="auth-toggle" onclick="toggleAuth(false)">沒有帳號？立即註冊</div>
        </div>
        <div class="auth-box" id="auth-register" style="display:none;">
            <h2>新兵註冊</h2>
            <input type="text" id="reg-user" placeholder="輸入新帳號 (最多8字)">
            <input type="password" id="reg-pass" placeholder="輸入新密碼">
            <button onclick="handleAuth('register')">完成註冊</button>
            <div class="auth-toggle" onclick="toggleAuth(true)">已有帳號？返回登入</div>
        </div>
    </div>

    <div id="ui-container">
        <div>目前玩家: <span id="current-name-val">未登入</span></div>
        <div>金幣: $<span id="money-val">0</span></div>
        <div>擊退殭屍: <span id="score-val">0</span></div>
        <div>生命值: <span id="hp-val">100</span>%</div>
        <button id="logout-btn" onclick="logout()">登出帳號</button>
        <br>
        <div id="weapon-info">武器: 未載入</div>
    </div>

    <button id="shop-btn" onclick="openShop(event)">🛒 武器商店</button>

    <div id="shop-ui">
        <h2>🛒 武器軍火庫</h2>
        <div id="shop-items-list"></div>
        <button id="close-shop" onclick="closeShop(event)">關閉商店</button>
    </div>

    <div id="leaderboard-container">
        <h3>🏆 歷史排行</h3>
        <div id="leaderboard-list"></div>
    </div>

    <div id="crosshair"></div>
    <div id="pc-hint">點擊畫面鎖定視角 (B鍵開啟商店/ESC釋放滑鼠)</div>

    <div id="mobile-controls">
        <div id="move-zone"><div id="joystick"></div></div>
        <div id="action-container">
            <div id="jump-btn">JUMP</div>
            <div id="shoot-btn">FIRE</div>
        </div>
    </div>

    <div id="game-over">
        你陣亡了...
        <button onclick="resetGame()" style="margin-top:15px; padding:10px 25px; background:#2ecc71; color:white; border:none; border-radius:5px; cursor:pointer;">重新出擊</button>
    </div>

    <script>
        let scene, camera, renderer;
        let zombies = [], bullets = [];
        let score = 0, hp = 100, money = 0, isGameOver = false, spawnTimer;
        let gunGroup, muzzleFlash;
        
        let cameraAngleX = 0, cameraAngleY = 0; 
        let moveDirection = { x: 0, z: 0 }; 
        
        let kbState = { w: 0, s: 0, a: 0, d: 0 };
        const mouseSensitivity = 0.0022;
        const playerSpeed = 0.16;

        let moveTouchId = null, moveStart = { x: 0, y: 0 };
        let lookTouchId = null, lookLast = { x: 0, y: 0 };

        let playerVelocityY = 0, isJumping = false;
        const gravity = -0.012, jumpStrength = 0.26, defaultPlayerHeight = 1.6;
        let walkTime = 0;

        let isShopOpen = false;
        let isMouseDown = false;
        let lastShotTime = 0;
        let currentAccount = null;

        const weapons = {
            glock: { name: "Glock 手槍", cost: 0, dmg: 1, delay: 300, auto: false, parts: [{w:0.04, h:0.04, d:0.18, x:0, y:0, z:-0.09, c:0x2c3e50},{w:0.035, h:0.08, d:0.04, x:0, y:-0.05, z:-0.04, c:0x1e272e}] },
            mp5: { name: "MP5 衝鋒槍", cost: 120, dmg: 1.2, delay: 110, auto: true, parts: [{w:0.04, h:0.06, d:0.35, x:0, y:0, z:-0.18, c:0x2f3640},{w:0.03, h:0.03, d:0.15, x:0, y:0, z:-0.4, c:0x718093},{w:0.03, h:0.07, d:0.04, x:0, y:-0.06, z:-0.1, c:0x1e272e},{w:0.03, h:0.05, d:0.12, x:0, y:-0.02, z:-0.02, c:0x2f3640}] },
            ak47: { name: "AK-47 突擊步槍", cost: 350, dmg: 2.8, delay: 140, auto: true, parts: [{w:0.04, h:0.07, d:0.45, x:0, y:0, z:-0.22, c:0x2c3e50},{w:0.03, h:0.03, d:0.25, x:0, y:0.01, z:-0.55, c:0xdcdde1},{w:0.035, h:0.06, d:0.2, x:0, y:-0.01, z:-0.2, c:0xcd6133},{w:0.03, h:0.08, d:0.18, x:0, y:-0.04, z:0.08, c:0xcd6133}] },
            awp: { name: "AWP 狙擊步槍", cost: 800, dmg: 10, delay: 1200, auto: false, parts: [{w:0.05, h:0.08, d:0.6, x:0, y:0, z:-0.3, c:0x218c74},{w:0.025, h:0.025, d:0.5, x:0, y:0.02, z:-0.8, c:0x2c3e50},{w:0.03, h:0.06, d:0.06, x:0, y:0.07, z:-0.25, c:0x2c3e50},{w:0.04, h:0.06, d:0.25, x:0, y:-0.03, z:0.1, c:0x218c74}] },
            m134: { name: "M134 迷你砲機槍", cost: 1500, dmg: 2.0, delay: 40, auto: true, parts: [{w:0.12, h:0.12, d:0.3, x:0, y:0, z:-0.15, c:0x2c3e50},{w:0.07, h:0.07, d:0.45, x:0, y:0, z:-0.5, c:0x1e272e},{w:0.02, h:0.02, d:0.45, x:0.02, y:0.02, z:-0.5, c:0x718093},{w:0.02, h:0.02, d:0.45, x:-0.02, y:-0.02, z:-0.5, c:0x718093}] }
        };
        let ownedWeapons = ["glock"];
        let currentWeaponKey = "glock";

        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

        function toggleAuth(showLogin) {
            document.getElementById('auth-login').style.display = showLogin ? 'block' : 'none';
            document.getElementById('auth-register').style.display = showLogin ? 'none' : 'block';
        }

        function handleAuth(type) {
            const user = document.getElementById(type === 'login' ? 'login-user' : 'reg-user').value.trim();
            const pass = document.getElementById(type === 'login' ? 'login-pass' : 'reg-pass').value.trim();

            if (!user || !pass) { alert("請填寫完整帳號密碼！"); return; }
            if (user.length > 8) { alert("帳號長度不可超過 8 個字！"); return; }

            let db = JSON.parse(localStorage.getItem('game_accounts') || '{}');

            if (type === 'register') {
                if (db[user]) { alert("此帳號已被註冊！"); return; }
                db[user] = { password: pass, money: 0, owned: ["glock"], current: "glock" };
                localStorage.setItem('game_accounts', JSON.stringify(db));
                alert("註冊成功！已自動切換回登入頁面。");
                toggleAuth(true);
            } else {
                if (!db[user] || db[user].password !== pass) { alert("帳號或密碼錯誤！"); return; }
                currentAccount = user;
                money = db[user].money;
                ownedWeapons = db[user].owned || ["glock"];
                currentWeaponKey = db[user].current || "glock";

                document.getElementById('current-name-val').innerText = currentAccount;
                document.getElementById('money-val').innerText = money;
                
                // 核心修正：先初始化 3D 引擎，再隱藏登入遮罩
                initGameEngine();
                document.getElementById('auth-screen').style.display = 'none';
                
                // 強制觸核：登入完畢後，立刻通知 3D 畫面重新對齊螢幕寬高，防黑屏
                onWindowResize();
            }
        }

        function saveUserData() {
            if (!currentAccount) return;
            let db = JSON.parse(localStorage.getItem('game_accounts') || '{}');
            if (db[currentAccount]) {
                db[currentAccount].money = money;
                db[currentAccount].owned = ownedWeapons;
                db[currentAccount].current = currentWeaponKey;
                localStorage.setItem('game_accounts', JSON.stringify(db));
            }
        }

        function logout() {
            saveUserData();
            location.reload();
        }

        function initGameEngine() {
            if (typeof THREE === 'undefined' || scene) return;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111116);
            scene.fog = new THREE.FogExp2(0x111116, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, defaultPlayerHeight, 0); 
            scene.add(camera); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, depth: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio || 1); 
            document.body.appendChild(renderer.domElement);

            const gridHelper = new THREE.GridHelper(500, 100, 0x444444, 0x222222);
            scene.add(gridHelper);

            // 稍微增強場景基本亮度，避免完全黑暗
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            for (let i = 0; i < 45; i++) {
                let h = 12 + Math.random() * 25;
                const bGeo = new THREE.BoxGeometry(8, h, 8);
                const bMat = new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.6 });
                const building = new THREE.Mesh(bGeo, bMat);
                let angle = Math.random() * Math.PI * 2;
                let radius = 25 + Math.random() * 80;
                building.position.set(Math.cos(angle) * radius, h / 2, Math.sin(angle) * radius);
                scene.add(building);
            }

            createGunSystem();
            
            if (isMobile) {
                document.getElementById('mobile-controls').style.display = 'block';
                setupMobileControls();
            } else {
                document.getElementById('pc-hint').style.display = 'block';
                setupPCControls();
            }

            updateLeaderboardUI();
            renderShop();
            window.addEventListener('resize', onWindowResize);
            spawnTimer = setInterval(spawnZombie, 1500);
            animate();
        }

        function createGunSystem() {
            gunGroup = new THREE.Group();
            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff200, transparent: true, opacity: 0 }));
            gunGroup.add(muzzleFlash);
            gunGroup.position.set(0.2, -0.25, -0.4);
            camera.add(gunGroup); 
            updateGunVisual();
        }

        function updateGunVisual() {
            if (!gunGroup) return;
            for (let i = gunGroup.children.length - 1; i >= 0; i--) {
                if (gunGroup.children[i] !== muzzleFlash) {
                    gunGroup.remove(gunGroup.children[i]);
                }
            }

            const w = weapons[currentWeaponKey];
            let maxDepth = 0;

            w.parts.forEach(p => {
                const geo = new THREE.BoxGeometry(p.w, p.h, p.d);
                const mat = new THREE.MeshStandardMaterial({ color: p.c, roughness: 0.5, metalness: 0.6 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(p.x, p.y, p.z);
                gunGroup.add(mesh);

                let tipPos = Math.abs(p.z) + p.d / 2;
